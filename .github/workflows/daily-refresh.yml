name: Daily Dashboard Refresh

on:
  schedule:
    # Runs at 8:00 AM IST (2:30 AM UTC) every day
    - cron: '30 2 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy

      - name: Run dashboard refresh
        env:
          REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
        run: |
          python update_dashboard.py
          python build_final.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.js
          git diff --cached --quiet || git commit -m "Auto-refresh: $(date +'%Y-%m-%d %H:%M')"
          git push
